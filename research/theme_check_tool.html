<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme spot-check</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--muted:#78716c;--card:#fff;--line:#e7e5e4;--acc:#1d4ed8}
@media (prefers-color-scheme:dark){:root{--bg:#1c1917;--fg:#f5f5f4;--muted:#a8a29e;
 --card:#292524;--line:#44403c;--acc:#93c5fd}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px}.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0}
.sent{font-size:18px;font-weight:600}.ctx{white-space:pre-wrap;color:var(--muted);font-size:14px}
.tag{display:inline-block;border:1px solid var(--acc);border-radius:999px;padding:2px 10px;margin:2px}
button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--line);
 background:var(--card);color:var(--fg);cursor:pointer;margin-right:6px}
kbd{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
</style></head><body><main>
<div class="muted" id="pos"></div>
<div class="card"><div class="muted" id="kind"></div><div class="sent" id="sent"></div></div>
<div class="card"><div class="muted">Themes the LLM assigned</div><div id="tags"></div></div>
<div><button data-v="1"><kbd>1</kbd> correct</button><button data-v="2"><kbd>2</kbd> partly</button>
<button data-v="3"><kbd>3</kbd> wrong</button><button id="back"><kbd>&larr;</kbd> back</button></div>
<details class="card"><summary class="muted">Full review (context)</summary><div class="ctx" id="ctx"></div></details>
<p class="muted" id="msg"></p>
</main><script>
let items=[],done={},i=0;const $=id=>document.getElementById(id);
async function init(){const r=await (await fetch('/api/state')).json();items=r.items;done=r.done;
 i=items.findIndex(x=>!done[x.sid]);if(i<0)i=items.length-1;show();}
function show(){const it=items[i];$('pos').textContent=`Sentence ${i+1} of ${items.length} · ${Object.keys(done).length} checked`;
 $('kind').textContent=it.kind==='complaint'?'complaint sentence':'praise sentence';$('sent').textContent=it.text;
 $('tags').innerHTML='';it.themes.forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent=t;$('tags').appendChild(s);});
 $('ctx').textContent=it.review;$('msg').textContent=done[it.sid]?'your answer: '+done[it.sid]:'';}
async function answer(v){const it=items[i];const r=await fetch('/api/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:it.sid,verdict:v})});
 if(!r.ok){$('msg').textContent='save failed';return;}done[it.sid]={'1':'correct','2':'partly','3':'wrong'}[v];
 if(i<items.length-1){i++;show();}else{show();$('msg').textContent='All done, thank you!';}}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>answer(b.dataset.v));
$('back').onclick=()=>{if(i>0){i--;show();}};
document.addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key))answer(e.key);else if(e.key==='ArrowLeft'&&i>0){i--;show();}});
init();
</script></body></html>
