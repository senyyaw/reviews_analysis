[project]
name = "review-analysis"
version = "0.1.0"
description = "Collect Apple App Store reviews, compute metrics and NLP insights, and serve them over a REST API."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "emoji>=2.16",
    "en-core-web-sm",
    "fastapi>=0.143",
    "ftfy>=6.3",
    "httpx>=0.28,<1",
    "jinja2>=3.1",
    "lingua-language-detector>=2.2.0",
    "onnxruntime>=1.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "scikit-learn>=1.9",
    "scipy>=1.14",
    "spacy>=3.8,<3.9",
    "tokenizers>=0.21",
    "uvicorn>=0.54",
    "vadersentiment>=3.3",  # its lexicon defines "generic sentiment words" (keywords.py)
]

[project.scripts]
review-analysis = "review_analysis.cli:main"

[project.optional-dependencies]
report = [
    "matplotlib>=3.9",
]
research = [
    "sentence-transformers>=6.1",
    "onnx>=1.17",
    "onnxscript>=0.2",
    "protobuf>=5",  # SentencePiece tokenizers (XLM-T)
]
translate = [
    "sentencepiece>=0.2",
    "torch>=2.14",
    "transformers>=5.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette 1.x nudges towards httpx2; httpx 0.28 is still the supported client here.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Visible punctuation that appears in real multilingual review text.
allowed-confusables = ["’", "！", "？", "。"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "onnxruntime.*", "vaderSentiment.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff.lint.per-file-ignores]
# Charts use typographic characters on purpose: ★ – × “ ” ≥
"src/review_analysis/viz.py" = ["RUF001"]
"src/review_analysis/analysis.py" = ["RUF001"]
